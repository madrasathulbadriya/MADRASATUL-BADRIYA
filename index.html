<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Al Madrasatul Badriya Kana 2540 - System Temporarily Closed">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Al Madrasatul Badriya Kana 2540 | Temporarily Closed</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-green: #0d5c3a;
      --accent-gold: #d4af37;
      --bg-dark: #0a110e;
      --text-light: #f3f4f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #052214 0%, #0d5c3a 50%, #061a10 100%);
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 1.5rem;
      text-align: center;
    }

    .closed-container {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 550px;
      width: 100%;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .closed-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.15);
      border: 2px solid var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      color: #ffffff;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    h2 {
      font-size: 1.3rem;
      color: var(--accent-gold);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: -0.5rem;
    }

    p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      max-width: 400px;
    }

    .badge-closed {
      background: #dc2626;
      color: #ffffff;
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      opacity: 0.6;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1rem;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="closed-container">
    <div class="closed-icon">
      <i class="fa-solid fa-lock"></i>
    </div>
    
    <h1>AL MADRASATUL BADRIYA</h1>
    <h2>KANA 2540</h2>
    
    <div class="badge-closed">
      <i class="fa-solid fa-triangle-exclamation"></i> Temporarily Closed
    </div>
    
    <p>ഈ സിസ്റ്റം താൽക്കാലികമായി നിർത്തിവെച്ചിരിക്കുന്നു. കൂടുതൽ വിവരങ്ങൾക്ക് കമ്മിറ്റിയുമായി ബന്ധപ്പെടുക.</p>
    
    <div class="footer-note">
      <span>Al Madrasatul Badriya Kana 2540 Committee</span>
    </div>
  </div>

</body>
</html>
